[workspace]
resolver = "2"
members = [
    "crates/grimoire-desktop",
]

[workspace.package]
version = "0.1.2-beta.4"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-only"
repository = "https://github.com/Ragnarok-Systems/eql-grimoire"
authors = ["James McMenamin"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

