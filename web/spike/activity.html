<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G9-03 Activity Spike</title>
<!--
  Spike artifact for G9-03. Kept in the tree, deliberately, so the eight questions this file
  answers can be re-taken later without re-deriving the probes. Not linked from web/app.html,
  not deployed by any later story, not the product. See eql-grimoire/docs/ACTIVITY-SPIKE.md
  for the requirement this page exists to satisfy.

  No build step, no framework, and no dependency on the product's prebuilt wasm module (which
  does not exist in this checkout — see REQ-009 in the story) or on web/corpus.grim being
  anything other than a static file one directory up. Opens as a plain file or from any static
  server: every probe below reports NOT-TESTED with
  the reason "not inside the Activity" unless the page is actually running inside a Discord
  Activity iframe, detected by hostname.
-->
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 900px; }
  h1 { font-size: 1.3rem; }
  .meta { font-size: 0.85rem; opacity: 0.75; margin-bottom: 1rem; }
  .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  select, button { font: inherit; padding: 0.3rem 0.6rem; }
  .card { border: 1px solid currentColor; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  .card h2 { margin: 0 0 0.35rem; font-size: 1rem; }
  .row { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; font-size: 0.85rem; }
  .verdict { font-weight: 700; padding: 0.05rem 0.4rem; border-radius: 4px; }
  .verdict-YES { background: #1a7f37; color: #fff; }
  .verdict-NO { background: #a40e26; color: #fff; }
  .verdict-PARTIAL { background: #9a6700; color: #fff; }
  .verdict-ERROR { background: #a40e26; color: #fff; }
  .verdict-NOT-TESTED { background: #57606a; color: #fff; }
  .verdict-PENDING { background: #57606a; color: #fff; opacity: 0.6; }
  pre.observed { white-space: pre-wrap; word-break: break-word; background: rgba(127,127,127,0.12);
    border-radius: 4px; padding: 0.5rem; margin: 0.4rem 0 0; font-size: 0.8rem; max-height: 12rem; overflow: auto; }
  .reason { font-style: italic; opacity: 0.85; }
  .runbtn { margin-top: 0.4rem; }
  #copyOut { width: 100%; height: 10rem; font-family: ui-monospace, monospace; font-size: 0.75rem; margin-top: 0.5rem; }
  #dropzone { border: 1px dashed currentColor; border-radius: 4px; padding: 0.6rem; margin-top: 0.4rem;
    font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<h1>G9-03 &mdash; Discord Activity hello-world probes</h1>
<p class="meta">
  Environment: <span id="envLabel">detecting…</span>.
  Loaded at <span id="loadedAt"></span>.
</p>

<div class="toolbar">
  <label for="platform">Platform this session is running on:</label>
  <select id="platform">
    <option value="desktop-app">desktop-app</option>
    <option value="web">web</option>
    <option value="ios">ios</option>
    <option value="android">android</option>
  </select>
  <button id="copyBtn">copy result block</button>
</div>
<textarea id="copyOut" readonly placeholder="Press &quot;copy result block&quot; to render the markdown rows for the selected platform, in the shape docs/ACTIVITY-SPIKE.md accepts."></textarea>

<div id="cards"></div>

<script>
(function () {
  "use strict";

  var LOADED_AT = new Date();
  document.getElementById("loadedAt").textContent = LOADED_AT.toISOString();

  /* A Discord Activity is served from a subdomain of discordsays.com — that is the only signal
     this page can use from inside the iframe to tell "actually in Discord" apart from "opened as
     a plain file or from a dev static server", per the constraint that every Discord-dependent
     probe below must read NOT-TESTED outside the Activity rather than a misleading real result. */
  var IN_DISCORD = /(^|\.)discordsays\.com$/.test(location.hostname);
  document.getElementById("envLabel").textContent = IN_DISCORD
    ? "inside a Discord Activity (" + location.hostname + ")"
    : "NOT inside a Discord Activity (" + (location.hostname || "local file") + ")";

  var NOT_IN_ACTIVITY_REASON = "not inside the Activity";

  function withTimeout(promiseFactory, ms) {
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        resolve({ verdict: "ERROR", reason: "timed out after " + ms + "ms", observed: "(no result within " + ms + "ms)" });
      }, ms);
      var ok = function (r) { if (settled) return; settled = true; clearTimeout(timer); resolve(r); };
      var fail = function (e) {
        if (settled) return; settled = true; clearTimeout(timer);
        resolve({ verdict: "ERROR", reason: "probe threw", observed: String(e && (e.stack || e.message || e)) });
      };
      try { promiseFactory().then(ok, fail); } catch (e) { fail(e); }
    });
  }

  function toHex(buf) {
    var bytes = new Uint8Array(buf);
    var out = [];
    for (var i = 0; i < bytes.length; i++) out.push(bytes[i].toString(16).padStart(2, "0"));
    return out.join(" ");
  }

  function notInActivity() {
    return Promise.resolve({ verdict: "NOT-TESTED", reason: NOT_IN_ACTIVITY_REASON, observed: "page is not running under a *.discordsays.com host" });
  }

  /* ══════════ The eight probes, REQ-004 ══════════
     Each returns {verdict, reason, observed, needsGesture, run} — needsGesture probes render a
     button instead of auto-running, because a file picker / directory picker / drop target
     needs a real user gesture and cannot be driven from page load. */

  var PROBES = [
    {
      id: "A1", name: "LAUNCH",
      question: "Does a LAUNCH_ACTIVITY response from a text-channel command open the Activity, and does the loading overlay dismiss?",
      auto: function () {
        /* AC-001: this row must NOT be filled from anything the page rendered — a page cannot
           observe its own launch, the overlay that covers it, or the client chrome around it.
           The only honest thing this probe can say is that its own script executed, which is
           necessary but not sufficient evidence of a completed, dismissed launch. */
        return Promise.resolve({
          verdict: "NOT-TESTED",
          reason: "the page cannot observe its own launch; record client version, invoking channel type, and overlay-dismiss time by hand from the Discord client itself",
          observed: "this script began executing at " + LOADED_AT.toISOString() + " (necessary but not sufficient evidence of a completed launch)"
        });
      }
    },
    {
      id: "A2", name: "FILE-INPUT",
      question: "Does <input type=file> open a picker inside the iframe and deliver a File whose bytes can be read?",
      needsGesture: true,
      render: function (card, done) {
        if (!IN_DISCORD) return done(notInActivity());
        var input = document.createElement("input");
        input.type = "file";
        input.addEventListener("change", function () {
          if (!input.files || !input.files.length) {
            return done(Promise.resolve({ verdict: "NO", reason: "no file returned by the picker", observed: "input.files.length === 0" }));
          }
          var f = input.files[0];
          done(withTimeout(function () {
            return f.slice(0, 16).arrayBuffer().then(function (buf) {
              return {
                verdict: "YES",
                reason: "",
                observed: "name=" + f.name + " size=" + f.size + " first16=" + toHex(buf)
              };
            }).catch(function (e) {
              return { verdict: "PARTIAL", reason: "picker returned a handle but bytes could not be read: " + e, observed: "name=" + f.name + " size=" + f.size };
            });
          }, 5000));
        });
        card.appendChild(input);
      }
    },
    {
      id: "A3", name: "DROP-PASTE",
      question: "Do a drop handler and a paste handler receive file or text data in the iframe?",
      needsGesture: true,
      render: function (card, done) {
        if (!IN_DISCORD) return done(notInActivity());
        var zone = document.createElement("div");
        zone.id = "dropzone";
        zone.tabIndex = 0;
        zone.textContent = "Drop a file here, or click and paste, to run A3.";
        var dropOk = null, pasteOk = null;
        var report = function () {
          if (dropOk === null || pasteOk === null) return;
          var v = (dropOk && pasteOk) ? "YES" : (dropOk || pasteOk) ? "PARTIAL" : "NO";
          done(Promise.resolve({
            verdict: v,
            reason: v === "YES" ? "" : "drop=" + dropOk + " paste=" + pasteOk,
            observed: "drop received=" + dropOk + ", paste received=" + pasteOk
          }));
        };
        zone.addEventListener("dragover", function (e) { e.preventDefault(); });
        zone.addEventListener("drop", function (e) {
          e.preventDefault();
          dropOk = !!(e.dataTransfer && (e.dataTransfer.files.length || e.dataTransfer.getData("text")));
          report();
        });
        zone.addEventListener("paste", function (e) {
          var cd = e.clipboardData;
          pasteOk = !!(cd && (cd.files.length || cd.getData("text")));
          report();
        });
        card.appendChild(zone);
      }
    },
    {
      id: "A4", name: "SANDBOX",
      question: "The literal allow/sandbox attributes on the iframe and the literal content-security-policy header served with the Activity document.",
      auto: function () {
        if (!IN_DISCORD) return notInActivity();
        /* REQ-008: same-origin access to window.frameElement is the only channel this page has
           to its own iframe attributes; a cross-origin embed (the expected case for Discord)
           makes frameElement inaccessible, and the CSP header is not readable via any JS API. */
        var lines = [];
        try {
          if (window.frameElement) {
            lines.push("allow=" + JSON.stringify(window.frameElement.getAttribute("allow")));
            lines.push("sandbox=" + JSON.stringify(window.frameElement.getAttribute("sandbox")));
          } else {
            lines.push("window.frameElement is null (page is the top frame, or same-origin access was denied)");
          }
        } catch (e) {
          lines.push("window.frameElement threw: " + e);
        }
        var metaCsp = document.querySelector('meta[http-equiv="Content-Security-Policy" i]');
        lines.push("meta CSP tag=" + (metaCsp ? JSON.stringify(metaCsp.getAttribute("content")) : "(none present)"));
        var readable = window.frameElement && metaCsp;
        return {
          verdict: readable ? "PARTIAL" : "NOT-TESTED",
          reason: readable ? "attribute text read from the page; the CSP header itself still needs confirming from client devtools" : "value could not be read by the page; record allow/sandbox attributes and the content-security-policy response header verbatim from the client's own developer tooling",
          observed: lines.join("\n")
        };
      }
    },
    {
      id: "A5", name: "WASM",
      question: "Does WebAssembly.instantiate succeed under that CSP, and does instantiateStreaming over a fetched module succeed?",
      auto: function () {
        if (!IN_DISCORD) return Promise.resolve(notInActivityValue());
        /* REQ-009: the four magic bytes ('\0asm') followed by the four version bytes — the
           smallest legal wasm module — built in the page from a literal array. This must never
           reference the product's prebuilt wasm module, which does not exist in this checkout. */
        var EMPTY_MODULE = new Uint8Array([0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00]);
        return withTimeout(function () {
          return WebAssembly.instantiate(EMPTY_MODULE).then(function () {
            /* A data: URL, not a second file in this folder, so instantiateStreaming exercises a
               real fetch()+MIME path without widening this story past its three listed files. */
            var dataUrl = "data:application/wasm;base64,AGFzbQEAAAA=";
            return fetch(dataUrl).then(function (resp) {
              return WebAssembly.instantiateStreaming(resp).then(function () {
                return { verdict: "YES", reason: "", observed: "WebAssembly.instantiate: ok; instantiateStreaming over data: URL (mime application/wasm): ok" };
              }, function (e) {
                return { verdict: "PARTIAL", reason: "instantiate ok, instantiateStreaming failed: " + e, observed: "WebAssembly.instantiate: ok; instantiateStreaming: " + e };
              });
            });
          }, function (e) {
            return { verdict: "NO", reason: "WebAssembly.instantiate threw", observed: String(e) };
          });
        }, 5000);
      }
    },
    {
      id: "A6", name: "RANGE",
      question: "Does a request carrying Range: bytes=0-63 through a declared URL mapping return 206 with exactly 64 bytes matching the whole artifact's first 64 bytes?",
      auto: function () {
        if (!IN_DISCORD) return Promise.resolve(notInActivityValue());
        var url = "../corpus.grim";
        return withTimeout(function () {
          return Promise.all([
            fetch(url, { headers: { Range: "bytes=0-63" } }),
            fetch(url)
          ]).then(function (r) {
            var ranged = r[0], whole = r[1];
            return Promise.all([ranged.arrayBuffer(), whole.arrayBuffer()]).then(function (b) {
              var rangedBytes = new Uint8Array(b[0]);
              var wholeBytes = new Uint8Array(b[1]);
              var contentRange = ranged.headers.get("content-range");
              var prefixMatch = rangedBytes.length >= 64 && Array.from(rangedBytes.slice(0, 64))
                .every(function (byte, i) { return byte === wholeBytes[i]; });
              var is64 = rangedBytes.length === 64;
              var verdict = (ranged.status === 206 && is64 && prefixMatch) ? "YES" : "NO";
              return {
                verdict: verdict,
                reason: verdict === "YES" ? "" : "status=" + ranged.status + " bytes=" + rangedBytes.length + " prefixMatch=" + prefixMatch,
                observed: "status=" + ranged.status + " content-range=" + JSON.stringify(contentRange) + " bytes-returned=" + rangedBytes.length + " prefix-matches-whole=" + prefixMatch
              };
            });
          }, function (e) {
            return { verdict: "ERROR", reason: "fetch threw", observed: String(e) };
          });
        }, 5000);
      }
    },
    {
      id: "A7", name: "FSA",
      question: "Is showDirectoryPicker present on window inside the iframe, and what happens when it is called?",
      needsGesture: true,
      render: function (card, done) {
        if (!IN_DISCORD) return done(notInActivity());
        if (typeof window.showDirectoryPicker !== "function") {
          return done(Promise.resolve({ verdict: "NO", reason: "showDirectoryPicker is not a function on window", observed: "typeof window.showDirectoryPicker === " + JSON.stringify(typeof window.showDirectoryPicker) }));
        }
        var btn = document.createElement("button");
        btn.className = "runbtn";
        btn.textContent = "call showDirectoryPicker()";
        btn.addEventListener("click", function () {
          done(withTimeout(function () {
            return window.showDirectoryPicker().then(function (handle) {
              return { verdict: "YES", reason: "", observed: "present and works; handle.name=" + JSON.stringify(handle && handle.name) };
            }, function (e) {
              return { verdict: "PARTIAL", reason: "present on window but the call rejected: " + (e && e.name), observed: "error.name=" + (e && e.name) + " error.message=" + (e && e.message) };
            });
          }, 5000));
        });
        card.appendChild(btn);
      }
    },
    {
      id: "A8", name: "LOOPBACK",
      question: "What exactly happens when the iframe requests http://127.0.0.1:8787?",
      auto: function () {
        if (!IN_DISCORD) return Promise.resolve(notInActivityValue());
        var violations = [];
        var onViolation = function (e) { violations.push(e.violatedDirective + " blocked " + e.blockedURI); };
        document.addEventListener("securitypolicyviolation", onViolation);
        return withTimeout(function () {
          return fetch("http://127.0.0.1:8787/").then(function (resp) {
            return { verdict: "ERROR", reason: "request did not fail as expected", observed: "status=" + resp.status + "; csp-violations-observed=" + JSON.stringify(violations) };
          }, function (e) {
            return { verdict: "NO", reason: "", observed: "fetch rejected: " + String(e) + "; csp-violations-observed=" + JSON.stringify(violations) + "; whether a permission prompt appeared cannot be observed by this page and must be recorded by hand" };
          });
        }, 5000).then(function (r) { document.removeEventListener("securitypolicyviolation", onViolation); return r; });
      }
    }
  ];

  function notInActivityValue() {
    return { verdict: "NOT-TESTED", reason: NOT_IN_ACTIVITY_REASON, observed: "page is not running under a *.discordsays.com host" };
  }

  var results = {}; // id -> {verdict, reason, observed, at}

  function renderResult(card, id, r) {
    r.at = new Date();
    results[id] = r;
    var body = card.querySelector(".body");
    var badge = "verdict-" + (["YES", "NO", "PARTIAL", "ERROR", "NOT-TESTED"].indexOf(r.verdict) >= 0 ? r.verdict : "NOT-TESTED");
    body.innerHTML =
      '<div class="row"><span class="verdict ' + badge + '">' + r.verdict + '</span>' +
      (r.reason ? '<span class="reason">' + escapeHtml(r.reason) + '</span>' : '') +
      '<span>ran ' + r.at.toISOString() + '</span></div>' +
      '<pre class="observed"></pre>';
    body.querySelector(".observed").textContent = r.observed == null ? "" : String(r.observed);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var container = document.getElementById("cards");
  PROBES.forEach(function (p) {
    var card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + p.id;
    card.innerHTML = '<h2>' + p.id + ' ' + p.name + '</h2><p class="reason">' + escapeHtml(p.question) + '</p><div class="gesture"></div><div class="body"></div>';
    container.appendChild(card);
    renderResult(card, p.id, { verdict: "PENDING", reason: "", observed: "running…" });

    if (p.needsGesture) {
      if (!IN_DISCORD) { renderResult(card, p.id, notInActivityValue()); return; }
      var done = function (promise) { promise.then(function (r) { renderResult(card, p.id, r); }); };
      p.render(card.querySelector(".gesture"), done);
      return;
    }

    Promise.resolve(p.auto()).then(function (r) { renderResult(card, p.id, r); });
  });

  /* ══════════ REQ-003: "copy result block" ══════════
     Emits, for the eight questions and the platform selected above, the exact markdown rows
     docs/ACTIVITY-SPIKE.md accepts: one "- platform: ... | verdict: ... | reason: ..." line and
     one fenced "observed: <platform>" block per question, so the tester transcribes by
     clipboard rather than by hand across four platforms. */
  function renderResultBlock(platform) {
    var out = [];
    var CLOSED_SET = ["YES", "NO", "PARTIAL", "ERROR", "NOT-TESTED"];
    PROBES.forEach(function (p) {
      var r = results[p.id];
      if (!r || CLOSED_SET.indexOf(r.verdict) === -1) {
        /* A probe still PENDING (never run, or a needsGesture probe nobody triggered) is not a
           verdict from the closed set REQ-012 fixes; the copy block must never emit PENDING. */
        r = { verdict: "NOT-TESTED", reason: "probe did not complete before the result block was copied", observed: "(no result)" };
      }
      out.push("- platform: " + platform + " | verdict: " + r.verdict + " | reason: " + (r.reason || "").replace(/\n/g, " "));
      out.push("observed: " + platform);
      out.push("```");
      out.push(String(r.observed == null ? "" : r.observed));
      out.push("```");
      out.push("");
    });
    return out.join("\n");
  }

  document.getElementById("copyBtn").addEventListener("click", function () {
    var platform = document.getElementById("platform").value;
    var text = renderResultBlock(platform);
    var out = document.getElementById("copyOut");
    out.value = text;
    out.focus();
    out.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { /* textarea above is the fallback */ });
    }
  });
})();
</script>
</body>
</html>
